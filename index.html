<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <script src="main.js" defer></script>
        <title>Library</title>
    </head>

    <body>
        <header>LIBRARY</header>
        
        <div class="books-wrapper">
            
            <div class="addBook">
                <div class="cover">
                    <button class="btn-addBook">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-plus"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M12 5l0 14" /><path d="M5 12l14 0" /></svg>
                    </button>
                </div>
    
                <div class="info">
                    <div class="title">***********</div>
                    <div class="author">**************</div>
                    <div class="category">*************</div>
                    <div class="pages">***********</div>
                </div>
            </div>

            <dialog class="formDialog">
                <form action="">
                    <div class="header">
                        <span>Add a book</span>
                        <button class="btn-closeForm"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-x"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M18 6l-12 12" /><path d="M6 6l12 12" /></svg></button>
                    </div>
        
                    <div class="title">
                        <span>Title</span>
                        <input type="text" required pattern="[A-Z a-z]+" placeholder="The best book ever">
                    </div>
        
                    <div class="author">
                        <span>Author</span>
                        <input type="text" required pattern="[A-Z a-z]+" placeholder="Of course me">
                    </div>
        
                    <div class="category">
                        <span>Category</span>
        
                        <select name="" id="" required>
                            <option value="" selected disabled>Select a category</option>
                            <option value="Fantasy">Fantasy</option>
                            <option value="Science Fiction">Science Fiction</option>
                            <option value="Mistery">Mistery</option>
                            <option value="Action">Action</option>
                        </select>
                    </div>
        
                    <div class="pages">
                        <span>No. pages</span>
                        <input type="number" min="1" required pattern="[0-9]+" placeholder="###">
                    </div>
        
                    <div class="readed">
                        <input type="checkbox" name="" id="">
                        <span>I have readed the book</span>
                    </div>
        
                    <div class="submit">
                        <button class="btn-submit" type="submit">Submit</button>
                    </div>
                </form>
            </dialog>
        </div>
    </body>
</html>
