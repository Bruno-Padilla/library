        <form action="#">
            <div class="header">
                <span>Add a book</span>
                <button class="btn-closeForm"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-x"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M18 6l-12 12" /><path d="M6 6l12 12" /></svg></button>
            </div>

            <div class="title">
                <span>Title</span>
                <input type="text">
            </div>

            <div class="author">
                <span>Author</span>
                <input type="text">
            </div>

            <div class="category">
                <span>Category</span>
                <input type="text">
            </div>

            <div class="pages">
                <span>No. pages</span>
                <input type="number" min="1">
            </div>

            <div class="readed">
                <input type="checkbox" name="" id="">
                <span>I have readed the book</span>

            </div>

            <div class="submit">
                <button class="btn-submit">Submit</button>
            </div>
